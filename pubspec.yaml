name: varshaura

description: "VarshAura Weather App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🌐 API
  http: ^1.2.1

  # 📍 LIVE LOCATION
  geolocator: ^11.0.0

  # 📅 DATE FORMAT
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 🔥 APP ICON
  flutter_launcher_icons: ^0.13.1

# 🔥 APP ICON CONFIG
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/